<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f1eb">
  <meta name="description" content="Test de livrare RoomSheet Studio: scenă 3D interactivă pentru telefon.">
  <title>RoomSheet — test livrare 3D</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font:16px/1.45 system-ui,sans-serif;color:#272622;background:#f4f1eb}
    main{max-width:680px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))}
    .eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#755d42}h1{font-size:clamp(26px,7vw,40px);line-height:1.07;margin:8px 0 10px}
    p{margin:0 0 18px;color:#625f57}.frame{height:min(55vh,480px);min-height:300px;border-radius:18px;overflow:hidden;background:#e9e4da;box-shadow:0 12px 35px #57483322}
    canvas{display:block;width:100%;height:100%;touch-action:none}.result{display:flex;justify-content:space-between;gap:16px;margin-top:15px;padding:14px 16px;border:1px solid #d8d1c5;border-radius:12px;background:white;font-size:14px}
    #angle{font-variant-numeric:tabular-nums;font-weight:700}small{display:block;margin-top:16px;color:#77736c}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">RoomSheet Studio · pasul 0</div>
    <h1>Test de livrare pe telefon</h1>
    <p>Scenă 3D simplă, fără cont și fără resurse externe. Atinge dulapul și rotește-l.</p>
    <div class="frame"><canvas id="view" aria-label="Scenă 3D interactivă"></canvas></div>
    <div class="result"><span id="status">Se inițializează scena 3D…</span><span id="angle">—</span></div>
    <small>Acest test verifică deschiderea și interacțiunea în aplicații de mesagerie. Nu conține date despre o cameră reală.</small>
  </main>
  <script>/*__BUNDLE__*/</script>
</body>
</html>
